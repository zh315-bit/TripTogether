name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: triptogether_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d triptogether_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/triptogether_test
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests, including PostgreSQL integration tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Run lint
        working-directory: frontend
        run: npm run lint
      - name: Run typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: triptogether_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d triptogether_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The Playwright config starts the migrated backend and the Vite dev
      # server itself; these are the backend's normal development settings.
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/triptogether_e2e
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests against the real stack
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
